spring.datasource.url=jdbc:h2:mem:solgas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

r2.access-key=test-access-key
r2.secret-key=test-secret-key
r2.endpoint=https://example.r2.cloudflarestorage.com
r2.bucket=test-bucket
r2.public-url=https://example.com

app.jwt.secret=test-jwt-secret-key-minimum-32-characters
app.jwt.expiration-ms=86400000

app.auth.login-rate-limit.max-attempts=10
app.auth.login-rate-limit.window-seconds=900

app.cors.allowed-origins=http://localhost:3000

app.images.max-dimension=1080
app.images.jpeg-quality=0.88

server.error.include-message=always
server.error.include-stacktrace=never

app.revalidate.secret=
app.revalidate.webhooks.solgasenlima=
app.revalidate.webhooks.surquillo=
