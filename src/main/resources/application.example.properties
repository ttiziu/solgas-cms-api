spring.datasource.url=jdbc:postgresql://HOST:5432/postgres
spring.datasource.username=
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

r2.access-key=
r2.secret-key=
r2.endpoint=https://ACCOUNT_ID.r2.cloudflarestorage.com
r2.bucket=solgas-cms-images
r2.public-url=https://pub-xxxxx.r2.dev

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Optimización al subir: redimensiona a max 1080px y guarda WebP (~alta calidad, peso bajo)
app.images.max-dimension=1080
app.images.jpeg-quality=0.88

server.error.include-message=always
server.error.include-stacktrace=never

# Revalidación on-demand de las webs Next (mismo secret en API y en REVALIDATE_SECRET de cada web)
app.revalidate.secret=${REVALIDATE_SECRET:}
# URLs separadas por coma si hay más de un dominio (www + apex)
app.revalidate.webhooks.solgasenlima=${REVALIDATE_WEBHOOK_SOLGASENLIMA:http://localhost:3000/api/revalidate}
app.revalidate.webhooks.surquillo=${REVALIDATE_WEBHOOK_SURQUILLO:http://localhost:3001/api/revalidate}
