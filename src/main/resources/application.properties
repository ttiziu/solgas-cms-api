spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.endpoint=${R2_ENDPOINT}
r2.bucket=${R2_BUCKET:solgas-cms-images}
r2.public-url=${R2_PUBLIC_URL}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

app.auth.login-rate-limit.max-attempts=10
app.auth.login-rate-limit.window-seconds=900

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.images.max-dimension=1080
app.images.jpeg-quality=0.88

server.error.include-message=always
server.error.include-stacktrace=never

app.revalidate.secret=${REVALIDATE_SECRET:}
app.revalidate.webhooks.solgasenlima=${REVALIDATE_WEBHOOK_SOLGASENLIMA:}
app.revalidate.webhooks.surquillo=${REVALIDATE_WEBHOOK_SURQUILLO:}
